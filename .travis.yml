language: python

dist: jammy

python:
  - "3.12"

env:
  global:
    - DJANGO_SECRET_KEY=travis-ci-testing-only-secret-key-not-for-production

install:
  - pip install -r requirements.txt
  - pip install black==26.10.1 flake8 coverage coveralls
script:
  - black --check .
  - flake8 .
  - coverage run --source=polls manage.py test
  - coverage report

after_success:
  - coveralls
